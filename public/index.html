<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dominius AI</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
<div class="background"><div class="particle-field"></div></div>

<div id="intro">
  <video id="iv" autoplay muted playsinline preload="auto">
    <source src="bg.mp4" type="video/mp4">
  </video>
  <div id="overlay"></div>
  <div id="content">
    <div id="eyebrow">BIENVENIDO A</div>
    <h1 id="title">DOMINIUS AI</h1>
    <div id="rule"></div>
    <p id="sub">Tu Inteligencia Artificial Empresarial</p>
  </div>
  <div id="skip" onclick="exitIntro()">SALTAR ›</div>
</div>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2 class="login-title">Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="input-group"><label>Usuario o Email</label><input type="text" id="loginUser" placeholder="Tu usuario o email" required></div>
      <div class="input-group"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="Tu contraseña" required></div>
      <div class="remember-me"><input type="checkbox" id="rememberMe"><label for="rememberMe">Recordar sesión</label></div>
      <button type="submit" class="login-button">Continuar</button>
    </form>
    <div class="form-footer">
      <span class="link" id="showForgotPassword">¿Olvidaste tu contraseña?</span>
      <span class="separator">·</span>
      <span class="link" id="showRegister">Crear cuenta</span>
    </div>
  </div>
</div>

<div class="login-screen" id="registerScreen">
  <div class="login-box">
    <h2 class="login-title">Crear Cuenta</h2>
    <form id="registerForm">
      <div class="input-group"><label>Nombre completo</label><input type="text" id="regName" placeholder="Tu nombre" required minlength="3"></div>
      <div class="input-group"><label>Usuario</label><input type="text" id="regUsername" placeholder="Nombre de usuario" required minlength="3"></div>
      <div class="input-group"><label>Email</label><input type="email" id="regEmail" placeholder="tu@email.com" required></div>
      <div class="input-group"><label>Contraseña</label><input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
      <div class="input-group"><label>Confirmar Contraseña</label><input type="password" id="regConfirmPassword" placeholder="Repite tu contraseña" required></div>
      <button type="submit" class="login-button">Crear Cuenta</button>
    </form>
    <div class="form-footer"><span class="link" id="showLogin">¿Ya tienes cuenta? Inicia sesión</span></div>
  </div>
</div>

<div class="login-screen" id="forgotPasswordScreen">
  <div class="login-box">
    <h2 class="login-title">Recuperar Acceso</h2>
    <p class="forgot-info">Ingresa tu email y te enviaremos un código de recuperación</p>
    <form id="forgotPasswordForm">
      <div class="input-group"><label>Email</label><input type="email" id="forgotEmail" placeholder="tu@email.com" required></div>
      <button type="submit" class="login-button">Enviar Código</button>
    </form>
    <div class="form-footer"><span class="link" id="backToLogin">Volver</span></div>
  </div>
</div>

<div class="notification" id="notification"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><p>Un momento...</p></div>

<style>
/* ─── INTRO ─── */
#intro {
  position: fixed; inset: 0; z-index: 999999;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  transition: opacity 1.4s cubic-bezier(0.76,0,0.24,1);
}
#intro.out { opacity: 0; pointer-events: none; }

/* Vídeo */
#iv {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 3s ease;
  transform: scale(1.06);
  animation: videoZoom 12s ease forwards;
}
#iv.loaded { opacity: 1; }
@keyframes videoZoom {
  from { transform: scale(1.08); }
  to   { transform: scale(1.0); }
}

/* Overlay multicapa */
#overlay {
  position: absolute; inset: 0; z-index: 1;
  background:
    /* viñeta */
    radial-gradient(ellipse 90% 90% at 50% 50%,
      transparent 30%,
      rgba(0,0,0,.5) 70%,
      rgba(0,0,0,.9) 100%),
    /* oscurecimiento general */
    rgba(0,0,0,.35);
}

/* Contenido */
#content {
  position: relative; z-index: 2;
  text-align: center;
  display: flex; flex-direction: column; align-items: center;
}

/* Eyebrow */
#eyebrow {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: clamp(10px, 1.2vw, 13px);
  font-weight: 400;
  letter-spacing: .6em;
  text-transform: uppercase;
  color: rgba(196,181,253,0);
  margin-bottom: clamp(10px,1.8vw,18px);
  animation: fadeSlideUp .8s cubic-bezier(0.16,1,0.3,1) 1s forwards;
}

/* Título */
#title {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: clamp(52px, 11vw, 130px);
  font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1;
  margin: 0;

  /* Gradiente texto */
  background: linear-gradient(
    160deg,
    #fff    0%,
    #ede9fe 20%,
    #c4b5fd 45%,
    #ede9fe 70%,
    #fff   100%
  );
  background-size: 200% auto;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;

  /* Estado inicial */
  opacity: 0;
  transform: scale(.94) translateY(16px);
  filter: blur(10px);

  animation:
    titleReveal 1.4s cubic-bezier(0.16,1,0.3,1) 1.3s forwards,
    shimmerMove 8s linear 2.9s infinite;

  /* Glow */
  -webkit-text-stroke: 0px transparent;
}

@keyframes titleReveal {
  0%   { opacity:0; transform:scale(.94) translateY(16px); filter:blur(10px); }
  100% { opacity:1; transform:scale(1)   translateY(0);    filter:blur(0); }
}

@keyframes shimmerMove {
  from { background-position: 0% center; }
  to   { background-position: 200% center; }
}

/* Glow del título — div separado */
#title-glow {
  position: absolute;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: clamp(52px, 11vw, 130px);
  font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1;
  color: rgba(167,139,250,.18);
  filter: blur(28px);
  pointer-events: none;
  top: 0; left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  opacity: 0;
  animation: glowIn 1.4s ease 1.3s forwards, glowPulse 4s ease-in-out 2.9s infinite;
}
@keyframes glowIn { to { opacity:1; } }
@keyframes glowPulse {
  0%,100% { opacity:.6; filter:blur(28px); }
  50%      { opacity:1;  filter:blur(35px); }
}

/* Regla */
#rule {
  width: 0; height: 1px;
  margin: clamp(22px,3.5vw,38px) 0 clamp(18px,3vw,30px);
  background: linear-gradient(90deg,
    transparent,
    rgba(255,255,255,.5) 20%,
    rgba(196,181,253,1)  50%,
    rgba(255,255,255,.5) 80%,
    transparent);
  box-shadow: 0 0 20px 3px rgba(167,139,250,.55);
  opacity: 0;
  animation: ruleGrow 1.1s cubic-bezier(0.16,1,0.3,1) 2.5s forwards;
}
@keyframes ruleGrow {
  0%   { width:0;                        opacity:0; }
  20%  { opacity:1; }
  100% { width:clamp(120px,28vw,320px);  opacity:1; }
}

/* Subtítulo */
#sub {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: clamp(12px, 1.6vw, 17px);
  font-weight: 300;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: rgba(220,215,255,0);
  margin: 0;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeSlideUp 1s cubic-bezier(0.16,1,0.3,1) 3.1s forwards;
}

@keyframes fadeSlideUp {
  0%   { opacity:0; color:rgba(220,215,255,0);   transform:translateY(12px); }
  100% { opacity:1; color:rgba(220,215,255,.7);  transform:translateY(0); }
}

/* Skip */
#skip {
  position: absolute; bottom:28px; right:30px; z-index:3;
  font-family: -apple-system, sans-serif;
  font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
  color: rgba(255,255,255,.18);
  cursor: pointer; user-select: none;
  opacity: 0;
  animation: fadeSlideUp .5s ease 3.5s forwards;
  transition: color .25s;
}
#skip:hover { color: rgba(255,255,255,.5); }

/* Wrapper del título para el glow relativo */
#title-wrap {
  position: relative;
  display: inline-block;
}
</style>

<script>
// ── VÍDEO ──
const vid = document.getElementById('iv');
vid.addEventListener('canplaythrough', () => vid.classList.add('loaded'), {once:true});
vid.addEventListener('loadeddata',     () => vid.classList.add('loaded'), {once:true});
// Fallback
setTimeout(() => vid.classList.add('loaded'), 800);

// ── AUDIO ──
let AC, audioStarted = false;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function buildScore() {
  if (audioStarted) return;
  audioStarted = true;
  try {
    const ac = getAC(), t = ac.currentTime;

    // Reverb grande
    const sr=ac.sampleRate, rl=Math.floor(sr*4);
    const rb=ac.createBuffer(2,rl,sr);
    for(let c=0;c<2;c++){
      const d=rb.getChannelData(c);
      for(let i=0;i<rl;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2);
    }
    const rv=ac.createConvolver(); rv.buffer=rb;
    const rg=ac.createGain(); rg.gain.value=.5;
    rv.connect(rg); rg.connect(ac.destination);

    function O(f,w,d,tp,v,det=0){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=tp||'sine'; o.frequency.value=f; o.detune.value=det;
      g.gain.setValueAtTime(0,t+w);
      g.gain.linearRampToValueAtTime(v,t+w+.06);
      g.gain.exponentialRampToValueAtTime(.0001,t+w+d);
      o.connect(g); g.connect(ac.destination); g.connect(rv);
      o.start(t+w); o.stop(t+w+d+.15);
    }
    function SW(f0,f1,w,d,v){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(f0,t+w);
      o.frequency.exponentialRampToValueAtTime(f1,t+w+d);
      g.gain.setValueAtTime(0,t+w);
      g.gain.linearRampToValueAtTime(v,t+w+.05);
      g.gain.exponentialRampToValueAtTime(.0001,t+w+d);
      o.connect(g); g.connect(ac.destination); g.connect(rv);
      o.start(t+w); o.stop(t+w+d+.15);
    }
    function NS(w,d,v,f){
      const b=ac.createBuffer(1,Math.floor(ac.sampleRate*d),ac.sampleRate);
      const da=b.getChannelData(0);
      for(let i=0;i<da.length;i++) da[i]=Math.random()*2-1;
      const src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
      fl.type='bandpass'; fl.frequency.value=f; fl.Q.value=.6;
      src.buffer=b;
      g.gain.setValueAtTime(0,t+w);
      g.gain.linearRampToValueAtTime(v,t+w+.04);
      g.gain.exponentialRampToValueAtTime(.0001,t+w+d);
      src.connect(fl); fl.connect(g); g.connect(ac.destination); g.connect(rv);
      src.start(t+w); src.stop(t+w+d+.1);
    }

    // Profundidad — rumble que emerge con el vídeo
    O(30, 0, 10, 'sine', .32);
    SW(28, 58, 0, 3.5, .28);
    NS(0, 3, .07, 70);

    // Activación del título ~1.3s
    SW(1800, 200, 1.0, 1.6, .04);
    NS(1.1, .6, .15, 400);
    O(55,  1.3, 7, 'sine',     .3);
    O(82,  1.4, 6, 'sine',     .15);
    O(110, 1.5, 5, 'triangle', .06);

    // Acorde épico en la regla ~2.5s
    [[110,.22],[138.6,.17],[165,.13],[220,.10],[277,.07],[330,.05],[440,.03],[554,.018]]
      .forEach(([f,v],i) => {
        O(f, 2.5+i*.065, 6, 'sine',     v);
        O(f, 2.5+i*.065, 6, 'triangle', v*.15, 6);
      });
    NS(2.5, .5, .2, 160);

    // Shimmer y brillo
    O(880,  3.0, 5, 'sine', .02);
    O(1320, 3.4, 4, 'sine', .01);
    SW(500, 1300, 2.8, 3.5, .015);

  } catch(e){}
}

// ── SALIDA ──
let done = false;
function exitIntro() {
  if (done) return; done = true;
  const el = document.getElementById('intro');
  el.classList.add('out');
  setTimeout(() => el.style.display = 'none', 1450);
}

setTimeout(exitIntro, 8000);

// Iniciar audio inmediatamente
setTimeout(() => { try{ buildScore(); }catch(e){} }, 100);
document.addEventListener('touchstart', () => { try{getAC();buildScore();}catch(e){} }, {once:true});
document.addEventListener('click',      () => { try{getAC();buildScore();}catch(e){} }, {once:true});
</script>

<script src="app.js"></script>
</body>
</html>
