<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Dominius AI</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
  <!-- Fondo de partículas (sutil) -->
  <div class="background"><div class="particle-field"></div></div>

  <!-- INTRO GLASSMORPHISM -->
  <div id="intro">
    <div class="intro-glass">
      <!-- Logo / Icono -->
      <div class="intro-logo">
        <!-- Si tienes imagen, reemplaza esto por <img src="tu-logo.png" alt="Dominius AI"> -->
        <div class="logo-placeholder">
          <span>DA</span>
        </div>
      </div>
      <!-- Título principal -->
      <h1 class="intro-title">DOMINIUS AI</h1>
      <!-- Línea decorativa -->
      <div class="intro-line"></div>
      <!-- Subtítulo -->
      <p class="intro-sub">Inteligencia Artificial Empresarial</p>
    </div>
  </div>

  <!-- PANTALLAS DE LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h2 class="login-title">Iniciar Sesión</h2>
      <form id="loginForm">
        <div class="input-group"><label>Usuario o Email</label><input type="text" id="loginUser" placeholder="Tu usuario o email" required></div>
        <div class="input-group"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="Tu contraseña" required></div>
        <div class="remember-me"><input type="checkbox" id="rememberMe"><label for="rememberMe">Recordar sesión</label></div>
        <button type="submit" class="login-button">Continuar</button>
      </form>
      <div class="form-footer">
        <span class="link" id="showForgotPassword">¿Olvidaste tu contraseña?</span>
        <span class="separator">·</span>
        <span class="link" id="showRegister">Crear cuenta</span>
      </div>
    </div>
  </div>

  <div class="login-screen" id="registerScreen">
    <div class="login-box">
      <h2 class="login-title">Crear Cuenta</h2>
      <form id="registerForm">
        <div class="input-group"><label>Nombre completo</label><input type="text" id="regName" placeholder="Tu nombre" required minlength="3"></div>
        <div class="input-group"><label>Usuario</label><input type="text" id="regUsername" placeholder="Nombre de usuario" required minlength="3"></div>
        <div class="input-group"><label>Email</label><input type="email" id="regEmail" placeholder="tu@email.com" required></div>
        <div class="input-group"><label>Contraseña</label><input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
        <div class="input-group"><label>Confirmar Contraseña</label><input type="password" id="regConfirmPassword" placeholder="Repite tu contraseña" required></div>
        <button type="submit" class="login-button">Crear Cuenta</button>
      </form>
      <div class="form-footer"><span class="link" id="showLogin">¿Ya tienes cuenta? Inicia sesión</span></div>
    </div>
  </div>

  <div class="login-screen" id="forgotPasswordScreen">
    <div class="login-box">
      <h2 class="login-title">Recuperar Acceso</h2>
      <p class="forgot-info">Ingresa tu email y te enviaremos un código de recuperación</p>
      <form id="forgotPasswordForm">
        <div class="input-group"><label>Email</label><input type="email" id="forgotEmail" placeholder="tu@email.com" required></div>
        <button type="submit" class="login-button">Enviar Código</button>
      </form>
      <div class="form-footer"><span class="link" id="backToLogin">Volver</span></div>
    </div>
  </div>

  <div class="notification" id="notification"></div>
  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><p>Un momento...</p></div>

  <script src="app.js"></script>
</body>
</html>
