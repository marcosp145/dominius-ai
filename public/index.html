<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dominius AI</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<style>
/* ─────────────────────────────────────────────
   INTRO
───────────────────────────────────────────── */
#intro {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0;
  /* Salida */
  transition: opacity 1.1s cubic-bezier(0.76, 0, 0.24, 1);
}
#intro.exit { opacity: 0; pointer-events: none; }

/* Fondo — halo respirando */
#intro-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse 90% 70% at 50% 52%,
    rgba(88, 28, 180, 0.20) 0%,
    rgba(55, 10, 120, 0.08) 45%,
    transparent 72%
  );
  opacity: 0;
  animation: haloPulse 3.8s ease-in-out infinite;
}
@keyframes haloPulse {
  0%, 100% { opacity: .55; transform: scale(1); }
  50%       { opacity: 1;   transform: scale(1.06); }
}

/* Línea horizontal sutil centrada */
#intro-line {
  position: absolute;
  top: 50%;
  left: 8%; right: 8%;
  height: 1px;
  transform: translateY(-50%);
  background: linear-gradient(
    90deg,
    transparent,
    rgba(139,92,246,.12) 20%,
    rgba(139,92,246,.12) 80%,
    transparent
  );
  opacity: 0;
  animation: lineAppear .6s ease 0.4s forwards;
}
@keyframes lineAppear { to { opacity: 1; } }

/* ── TÍTULO ── */
#title-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}

#title-text {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display',
               'Helvetica Neue', sans-serif;
  font-size: clamp(40px, 8.5vw, 96px);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1;
  white-space: nowrap;

  /* Gradiente del texto */
  background: linear-gradient(
    128deg,
    #ffffff    0%,
    #ede9fe   28%,
    #a78bfa   55%,
    #ede9fe   78%,
    #ffffff  100%
  );
  background-size: 200% auto;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;

  /* Empieza invisible — el láser lo revela */
  clip-path: inset(0 101% 0 0);

  /* Animación de reveal sincronizada con el láser */
  animation:
    textReveal 1.5s cubic-bezier(0.76, 0, 0.24, 1) 0.7s forwards,
    shimmer    4s linear 2.4s infinite;

  filter: drop-shadow(0 0 55px rgba(139,92,246,.4));
}

@keyframes textReveal {
  0%   { clip-path: inset(0 101% 0 0); }
  100% { clip-path: inset(0 -2% 0 0);  }
}

@keyframes shimmer {
  0%   { background-position: 0% center; }
  100% { background-position: 200% center; }
}

/* ── LÁSER ── */
#laser {
  position: absolute;
  top: -15%;
  bottom: -15%;
  width: 2px;
  left: 0%;
  pointer-events: none;
  opacity: 0;

  background: linear-gradient(
    180deg,
    transparent 0%,
    rgba(216,180,254,.6) 20%,
    #ffffff 50%,
    rgba(216,180,254,.6) 80%,
    transparent 100%
  );

  /* Halo del láser */
  box-shadow:
    0 0  6px 2px rgba(167,139,250, .9),
    0 0 16px 4px rgba(139, 92,246, .6),
    0 0 35px 8px rgba(109, 40,217, .35),
    0 0 70px 16px rgba(88,  28,180, .15);

  animation: laserTravel 1.5s cubic-bezier(0.76, 0, 0.24, 1) 0.7s forwards;
}

@keyframes laserTravel {
  0%   { left: 0%;    opacity: 1; }
  95%  { left: 100%;  opacity: 1; }
  100% { left: 100%;  opacity: 0; }
}

/* Destello inicial del láser */
#laser::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 20px; height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, rgba(167,139,250,.4) 60%, transparent 100%);
  filter: blur(4px);
}

/* ── SUBTÍTULO ── */
#sub-text {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display',
               'Helvetica Neue', sans-serif;
  font-size: clamp(11px, 1.5vw, 16px);
  font-weight: 300;
  letter-spacing: .45em;
  text-transform: uppercase;
  color: rgba(167,139,250,0);
  margin-top: clamp(14px, 2.5vw, 26px);
  opacity: 0;
  transform: translateY(14px);
  animation: subReveal .9s cubic-bezier(0.25,0.46,0.45,0.94) 2.5s forwards;
}

@keyframes subReveal {
  0%   { opacity: 0; color: rgba(167,139,250,0);    transform: translateY(14px); }
  100% { opacity: 1; color: rgba(167,139,250,.65);  transform: translateY(0); }
}

/* ── PUNTO / ORB debajo del subtítulo ── */
#orb {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #8b5cf6;
  margin-top: clamp(22px, 4vw, 40px);
  box-shadow: 0 0 12px 4px rgba(139,92,246,.6);
  opacity: 0;
  animation: orbIn .5s ease 3.2s forwards, orbPulse 2s ease-in-out 3.7s infinite;
}
@keyframes orbIn { to { opacity: 1; } }
@keyframes orbPulse {
  0%,100% { transform: scale(1);   box-shadow: 0 0 12px 4px rgba(139,92,246,.6); }
  50%      { transform: scale(1.5); box-shadow: 0 0 20px 8px rgba(139,92,246,.4); }
}

/* ── SKIP ── */
#skip-btn {
  position: absolute;
  bottom: 28px; right: 28px;
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,.15);
  cursor: pointer;
  opacity: 0;
  animation: fadeIn .8s ease 2.2s forwards;
  transition: color .3s ease;
  user-select: none;
}
#skip-btn:hover { color: rgba(255,255,255,.4); }
@keyframes fadeIn { to { opacity: 1; } }

/* Viñeta sutil */
#intro-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    ellipse 100% 100% at 50% 50%,
    transparent 40%,
    rgba(0,0,0,.55) 100%
  );
}
</style>
</head>
<body>

<div class="background"><div class="particle-field"></div></div>

<!-- ── INTRO ── -->
<div id="intro">
  <div id="intro-bg"></div>
  <div id="intro-line"></div>
  <div id="intro-vignette"></div>

  <div id="title-wrap">
    <span id="title-text">DOMINIUS AI</span>
    <div id="laser"></div>
  </div>

  <div id="sub-text">Tu IA Empresarial</div>
  <div id="orb"></div>

  <div id="skip-btn">Saltar</div>
</div>

<!-- ── LOGIN ── -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2 class="login-title">Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="input-group"><label>Usuario o Email</label><input type="text" id="loginUser" placeholder="Tu usuario o email" required></div>
      <div class="input-group"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="Tu contraseña" required></div>
      <div class="remember-me"><input type="checkbox" id="rememberMe"><label for="rememberMe">Recordar sesión</label></div>
      <button type="submit" class="login-button">Continuar</button>
    </form>
    <div class="form-footer">
      <span class="link" id="showForgotPassword">¿Olvidaste tu contraseña?</span>
      <span class="separator">·</span>
      <span class="link" id="showRegister">Crear cuenta</span>
    </div>
  </div>
</div>

<div class="login-screen" id="registerScreen">
  <div class="login-box">
    <h2 class="login-title">Crear Cuenta</h2>
    <form id="registerForm">
      <div class="input-group"><label>Nombre completo</label><input type="text" id="regName" placeholder="Tu nombre" required minlength="3"></div>
      <div class="input-group"><label>Usuario</label><input type="text" id="regUsername" placeholder="Nombre de usuario" required minlength="3"></div>
      <div class="input-group"><label>Email</label><input type="email" id="regEmail" placeholder="tu@email.com" required></div>
      <div class="input-group"><label>Contraseña</label><input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
      <div class="input-group"><label>Confirmar Contraseña</label><input type="password" id="regConfirmPassword" placeholder="Repite tu contraseña" required></div>
      <button type="submit" class="login-button">Crear Cuenta</button>
    </form>
    <div class="form-footer"><span class="link" id="showLogin">¿Ya tienes cuenta? Inicia sesión</span></div>
  </div>
</div>

<div class="login-screen" id="forgotPasswordScreen">
  <div class="login-box">
    <h2 class="login-title">Recuperar Acceso</h2>
    <p class="forgot-info">Ingresa tu email y te enviaremos un código de recuperación</p>
    <form id="forgotPasswordForm">
      <div class="input-group"><label>Email</label><input type="email" id="forgotEmail" placeholder="tu@email.com" required></div>
      <button type="submit" class="login-button">Enviar Código</button>
    </form>
    <div class="form-footer"><span class="link" id="backToLogin">Volver</span></div>
  </div>
</div>

<div class="notification" id="notification"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><p>Un momento...</p></div>

<script>
(function () {
  const intro = document.getElementById('intro');
  const skip  = document.getElementById('skip-btn');
  let finished = false;

  /* ── AUDIO ── */
  function buildAudio() {
    try {
      const AC  = new (window.AudioContext || window.webkitAudioContext)();
      const now = AC.currentTime;

      /* Reverb convolution sencillo */
      function makeReverb(dur = 1.8, decay = 2.5) {
        const sr  = AC.sampleRate;
        const len = sr * dur;
        const buf = AC.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = buf.getChannelData(c);
          for (let i = 0; i < len; i++)
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
        const node = AC.createConvolver();
        node.buffer = buf;
        return node;
      }

      const reverb  = makeReverb(2.2, 3);
      const masterG = AC.createGain();
      masterG.gain.value = .85;
      reverb.connect(masterG);
      masterG.connect(AC.destination);

      function osc(freq, start, dur, type = 'sine', vol = 0.15, detune = 0) {
        const o = AC.createOscillator();
        const g = AC.createGain();
        o.type = type; o.frequency.value = freq; o.detune.value = detune;
        g.gain.setValueAtTime(0, now + start);
        g.gain.linearRampToValueAtTime(vol, now + start + .04);
        g.gain.exponentialRampToValueAtTime(.0001, now + start + dur);
        o.connect(g); g.connect(reverb); g.connect(AC.destination);
        o.start(now + start); o.stop(now + start + dur + .1);
      }

      function sweep(f0, f1, start, dur, vol = .2) {
        const o = AC.createOscillator();
        const g = AC.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f0, now + start);
        o.frequency.exponentialRampToValueAtTime(f1, now + start + dur);
        g.gain.setValueAtTime(0, now + start);
        g.gain.linearRampToValueAtTime(vol, now + start + .03);
        g.gain.exponentialRampToValueAtTime(.0001, now + start + dur);
        o.connect(g); g.connect(reverb); g.connect(AC.destination);
        o.start(now + start); o.stop(now + start + dur + .1);
      }

      /* Sub profundo */
      osc(40,  .4, 5.5, 'sine', .28);
      osc(40,  .4, 5.5, 'triangle', .07, -8);

      /* Sub sweep — tensión */
      sweep(32, 75, .4, 2.6, .22);

      /* Sonido del láser — sweep descendente agudo */
      sweep(2200, 380, .7, 1.5, .045);
      sweep(1800, 300, .75, 1.4, .025);

      /* Acorde que se despliega después del reveal */
      const chord = [220, 277.18, 329.63, 440, 554.37];
      chord.forEach((f, i) => {
        osc(f, 2.3 + i * .06, 4.5, 'sine', .1 - i * .015);
        osc(f, 2.3 + i * .06, 4.5, 'triangle', .025 - i * .003, 5);
      });

      /* Shimmer alto */
      osc(880,  2.6, 3.5, 'sine', .025);
      osc(1100, 2.9, 3.0, 'sine', .012);

    } catch (e) { /* sin audio si falla */ }
  }

  /* ── SALIDA ── */
  function finish() {
    if (finished) return;
    finished = true;
    intro.classList.add('exit');
    setTimeout(() => { intro.style.display = 'none'; }, 1150);
  }

  /* Salida automática: reveal acaba ~2.2s, subtítulo ~3.4s, orb ~3.7s
     Dejamos hold hasta 5.6s y salimos */
  setTimeout(finish, 5600);

  skip.addEventListener('click', finish);

  /* Iniciar audio al primer gesto o inmediatamente si ya permitido */
  let audioStarted = false;
  function startAudio() {
    if (audioStarted) return;
    audioStarted = true;
    buildAudio();
  }

  /* En desktop lanzamos directo */
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', () => setTimeout(startAudio, 50));
  else
    setTimeout(startAudio, 50);

  /* Fallback para móviles que bloquean audio sin gesto */
  document.addEventListener('touchstart', startAudio, { once: true });
  document.addEventListener('click',      startAudio, { once: true });

})();
</script>

<script src="app.js"></script>
</body>
</html>
