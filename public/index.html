<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dominius AI</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
<div class="background"><div class="particle-field"></div></div>

<canvas id="c"></canvas>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2 class="login-title">Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="input-group"><label>Usuario o Email</label><input type="text" id="loginUser" placeholder="Tu usuario o email" required></div>
      <div class="input-group"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="Tu contraseña" required></div>
      <div class="remember-me"><input type="checkbox" id="rememberMe"><label for="rememberMe">Recordar sesión</label></div>
      <button type="submit" class="login-button">Continuar</button>
    </form>
    <div class="form-footer">
      <span class="link" id="showForgotPassword">¿Olvidaste tu contraseña?</span>
      <span class="separator">·</span>
      <span class="link" id="showRegister">Crear cuenta</span>
    </div>
  </div>
</div>

<div class="login-screen" id="registerScreen">
  <div class="login-box">
    <h2 class="login-title">Crear Cuenta</h2>
    <form id="registerForm">
      <div class="input-group"><label>Nombre completo</label><input type="text" id="regName" placeholder="Tu nombre" required minlength="3"></div>
      <div class="input-group"><label>Usuario</label><input type="text" id="regUsername" placeholder="Nombre de usuario" required minlength="3"></div>
      <div class="input-group"><label>Email</label><input type="email" id="regEmail" placeholder="tu@email.com" required></div>
      <div class="input-group"><label>Contraseña</label><input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
      <div class="input-group"><label>Confirmar Contraseña</label><input type="password" id="regConfirmPassword" placeholder="Repite tu contraseña" required></div>
      <button type="submit" class="login-button">Crear Cuenta</button>
    </form>
    <div class="form-footer"><span class="link" id="showLogin">¿Ya tienes cuenta? Inicia sesión</span></div>
  </div>
</div>

<div class="login-screen" id="forgotPasswordScreen">
  <div class="login-box">
    <h2 class="login-title">Recuperar Acceso</h2>
    <p class="forgot-info">Ingresa tu email y te enviaremos un código de recuperación</p>
    <form id="forgotPasswordForm">
      <div class="input-group"><label>Email</label><input type="email" id="forgotEmail" placeholder="tu@email.com" required></div>
      <button type="submit" class="login-button">Enviar Código</button>
    </form>
    <div class="form-footer"><span class="link" id="backToLogin">Volver</span></div>
  </div>
</div>

<div class="notification" id="notification"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><p>Un momento...</p></div>

<style>
#c {
  position: fixed;
  inset: 0;
  z-index: 999999;
  width: 100%;
  height: 100%;
  display: block;
  cursor: pointer;
}
</style>

<script>
(function () {

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, cx, cy, raf, t0, done = false;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', () => { resize(); });

/* ══════════════════════════════════════
   AUDIO — cinematic score
══════════════════════════════════════ */
let AC;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function buildScore() {
  try {
    const ac  = getAC();
    const now = ac.currentTime;

    // Master reverb
    const rvSr  = ac.sampleRate;
    const rvLen = rvSr * 3.5;
    const rvBuf = ac.createBuffer(2, rvLen, rvSr);
    for (let ch = 0; ch < 2; ch++) {
      const d = rvBuf.getChannelData(ch);
      for (let i = 0; i < rvLen; i++)
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rvLen, 2.8);
    }
    const rv = ac.createConvolver();
    rv.buffer = rvBuf;
    const rvG = ac.createGain(); rvG.gain.value = .5;
    rv.connect(rvG); rvG.connect(ac.destination);

    function O(freq, start, dur, type = 'sine', vol = .15, det = 0) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq; o.detune.value = det;
      g.gain.setValueAtTime(0, now + start);
      g.gain.linearRampToValueAtTime(vol, now + start + .06);
      g.gain.exponentialRampToValueAtTime(.0001, now + start + dur);
      o.connect(g); g.connect(ac.destination); g.connect(rv);
      o.start(now + start); o.stop(now + start + dur + .15);
    }

    function SW(f0, f1, start, dur, vol = .2) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, now + start);
      o.frequency.exponentialRampToValueAtTime(f1, now + start + dur);
      g.gain.setValueAtTime(0, now + start);
      g.gain.linearRampToValueAtTime(vol, now + start + .05);
      g.gain.exponentialRampToValueAtTime(.0001, now + start + dur);
      o.connect(g); g.connect(ac.destination); g.connect(rv);
      o.start(now + start); o.stop(now + start + dur + .15);
    }

    function NS(start, dur, vol = .12, freq = 300) {
      const sr  = ac.sampleRate;
      const buf = ac.createBuffer(1, sr * dur, sr);
      const d   = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource();
      src.buffer = buf;
      const fl = ac.createBiquadFilter();
      fl.type = 'bandpass'; fl.frequency.value = freq; fl.Q.value = .6;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, now + start);
      g.gain.linearRampToValueAtTime(vol, now + start + .04);
      g.gain.exponentialRampToValueAtTime(.0001, now + start + dur);
      src.connect(fl); fl.connect(g); g.connect(ac.destination); g.connect(rv);
      src.start(now + start); src.stop(now + start + dur + .1);
    }

    // ── Silencio absoluto 0–0.6s ──

    // Rumble que crece del suelo
    O(28,  .6, 7,  'sine',     .4);
    O(28,  .6, 7,  'triangle', .1, -6);
    SW(25, 55, .6, 3.5,        .28);
    NS(.6, 2,  .08, 80);

    // Tensión media — el horizonte aparece ~1.2s
    SW(80, 140, 1.8, 2, .12);
    NS(1.8, 1.2, .06, 200);

    // IMPACTO — el texto toca suelo ~3.5s
    NS(3.4, .6,  .45, 120);
    NS(3.4, .25, .3,  60);
    O(35,  3.4, 4,   'sine', .5);
    O(55,  3.5, 3.5, 'sine', .25);
    O(70,  3.6, 3,   'sine', .15);

    // Acorde épico que se despliega
    [[110,.18],[138.6,.14],[165,.10],[220,.08],[277,.055],[330,.035]]
      .forEach(([f, v], i) => {
        O(f, 3.8 + i * .07, 5.5, 'sine', v);
        O(f, 3.8 + i * .07, 5.5, 'triangle', v * .2, 8);
      });

    // Shimmer
    O(880,  4.2, 4, 'sine', .022);
    O(1320, 4.6, 3, 'sine', .012);
    SW(600, 1400, 4.0, 2.5, .018);

    // Crescendo final — llamarada ~7.5s
    SW(55, 30, 7.0, 1.5, .3);
    NS(7.3, .8, .55, 250);
    NS(7.3, .4, .35, 80);
    O(40, 7.3, 2, 'sine', .4);

  } catch (e) {}
}

/* ══════════════════════════════════════
   EASING
══════════════════════════════════════ */
const easeOutExpo  = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
const easeInExpo   = t => t === 0 ? 0 : Math.pow(2, 10 * t - 10);
const easeInOutQ   = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
const clamp        = (v, a, b) => Math.min(b, Math.max(a, v));
const invlerp      = (a, b, v) => clamp((v - a) / (b - a), 0, 1);

/* ══════════════════════════════════════
   TIMELINE (segundos)
   0.0  negro puro
   0.6  rumble empieza
   1.2  horizonte comienza a salir
   3.5  texto llega abajo → impacto
   4.0  texto sube a su posición final
   5.5  subtítulo aparece
   7.3  llamarada blanca
   7.9  fade a negro
   8.6  finish
══════════════════════════════════════ */

let flash = 0;
let scoreStarted = false;

function draw(ts) {
  if (done) return;
  if (!t0) t0 = ts;
  const T = (ts - t0) / 1000;

  /* Lanzar audio en primer frame (desktop) o tras gesto (móvil) */
  if (!scoreStarted && T > .1) {
    scoreStarted = true;
    buildScore();
  }

  ctx.clearRect(0, 0, W, H);

  // ── FONDO NEGRO ──
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // ── HORIZONTE ──
  // Aparece entre t=1.2 y t=3.5 desde abajo
  const hProg  = easeOutExpo(invlerp(1.2, 3.2, T));
  const hY     = H * (.52 + (1 - hProg) * .6); // baja desde fuera de pantalla

  if (hProg > 0) {
    // Glow del horizonte — planeta lejano
    const gR = Math.max(W, H) * 1.1;
    const grd = ctx.createRadialGradient(cx, hY, 0, cx, hY, gR);
    grd.addColorStop(0,    `rgba(180,100,255,${.32 * hProg})`);
    grd.addColorStop(.04,  `rgba(140,60,240,${.28 * hProg})`);
    grd.addColorStop(.12,  `rgba(88,28,180,${.2 * hProg})`);
    grd.addColorStop(.3,   `rgba(40,10,100,${.1 * hProg})`);
    grd.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // Línea del horizonte nítida
    const lineAlpha = Math.min(1, hProg * 2);
    const lGrd = ctx.createLinearGradient(0, 0, W, 0);
    lGrd.addColorStop(0,   'rgba(180,120,255,0)');
    lGrd.addColorStop(.15, `rgba(210,160,255,${lineAlpha})`);
    lGrd.addColorStop(.5,  `rgba(255,255,255,${lineAlpha})`);
    lGrd.addColorStop(.85, `rgba(210,160,255,${lineAlpha})`);
    lGrd.addColorStop(1,   'rgba(180,120,255,0)');
    ctx.save();
    ctx.shadowBlur  = 30 * hProg;
    ctx.shadowColor = `rgba(180,120,255,${.8 * hProg})`;
    ctx.strokeStyle = lGrd;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, hY); ctx.lineTo(W, hY);
    ctx.stroke();
    ctx.restore();

    // Rayos de luz que salen del horizonte hacia arriba
    const rayAlpha = hProg * .07;
    for (let i = 0; i < 9; i++) {
      const angle = (i / 8) * Math.PI - Math.PI / 2 + (Math.sin(T * .4 + i) * .04);
      const len   = H * 1.4;
      ctx.save();
      ctx.globalAlpha = rayAlpha * (1 - Math.abs((i / 8) - .5) * .8);
      const rGrd = ctx.createLinearGradient(
        cx, hY,
        cx + Math.cos(angle) * len,
        hY  + Math.sin(angle) * len
      );
      rGrd.addColorStop(0,   'rgba(180,100,255,.9)');
      rGrd.addColorStop(.4,  'rgba(120,60,220,.3)');
      rGrd.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.strokeStyle = rGrd;
      ctx.lineWidth   = len * .08;
      ctx.beginPath();
      ctx.moveTo(cx, hY);
      ctx.lineTo(cx + Math.cos(angle) * len, hY + Math.sin(angle) * len);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ── TEXTO DOMINIUS AI ──
  const mob   = W < 600;
  const fs    = mob ? 42 : Math.min(96, W * .085);
  const fs2   = mob ? 13 : Math.min(17, W * .015);

  // Fase 1: cae desde arriba hasta cy+H*0.4 (impacto) entre t=1.5 y t=3.5
  // Fase 2: sube a su posición final cy-fs*.1 entre t=3.5 y t=4.5
  let titleY;
  const fallProg = easeInExpo(invlerp(1.5, 3.5, T));
  const riseProg = easeOutExpo(invlerp(3.5, 4.6, T));

  const impactY = cy + fs * .5;
  const finalY  = cy - fs * .15;
  const startY  = -fs;

  if (T < 3.5) {
    titleY = startY + (impactY - startY) * fallProg;
  } else {
    titleY = impactY + (finalY - impactY) * riseProg;
  }

  const titleAlpha = clamp(invlerp(1.5, 2.5, T), 0, 1);

  if (titleAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = titleAlpha;

    // Impacto: vibración al aterrizar
    let shake = 0;
    if (T > 3.45 && T < 3.8) {
      const st = (T - 3.45) / .35;
      shake = Math.sin(st * Math.PI * 8) * (1 - st) * (mob ? 3 : 6);
    }

    ctx.font      = `700 ${fs}px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Glow del texto
    const glowP  = riseProg;
    ctx.shadowBlur  = 60 + Math.sin(T * 1.5) * 15;
    ctx.shadowColor = `rgba(167,139,250,${.7 * glowP + .3})`;

    // Gradiente del texto
    const tGrd = ctx.createLinearGradient(cx - fs * 3, 0, cx + fs * 3, 0);
    tGrd.addColorStop(0,   '#fff');
    tGrd.addColorStop(.3,  '#e9d5ff');
    tGrd.addColorStop(.55, '#a78bfa');
    tGrd.addColorStop(.75, '#e9d5ff');
    tGrd.addColorStop(1,   '#fff');
    ctx.fillStyle = tGrd;
    ctx.fillText('DOMINIUS AI', cx + shake, titleY + shake * .3);

    // Segundo pase — brillo interior
    ctx.shadowBlur  = 20;
    ctx.shadowColor = '#fff';
    ctx.globalAlpha = titleAlpha * .25;
    ctx.fillStyle   = '#fff';
    ctx.fillText('DOMINIUS AI', cx + shake, titleY + shake * .3);

    ctx.restore();
  }

  // ── SUBTÍTULO ──
  const subAlpha = easeOutExpo(invlerp(5.5, 6.4, T));
  const subY     = finalY + fs * .75 + (1 - subAlpha) * 16;

  if (subAlpha > 0) {
    ctx.save();
    ctx.globalAlpha  = subAlpha * .7;
    ctx.font         = `300 ${fs2}px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.letterSpacing = '0.4em';
    ctx.fillStyle    = '#c4b5fd';
    ctx.shadowBlur   = 20;
    ctx.shadowColor  = 'rgba(167,139,250,.5)';
    ctx.fillText('TU IA EMPRESARIAL', cx, subY);
    ctx.restore();
  }

  // ── LLAMARADA FINAL ──
  if (T > 7.3) {
    const fp = invlerp(7.3, 7.75, T);
    flash = Math.max(flash, easeInOutQ(fp < .5 ? fp * 2 : (1 - fp) * 2));
  }

  // ── FLASH ──
  if (flash > .001) {
    ctx.save();
    ctx.globalAlpha = flash;
    const fGrd = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .8);
    fGrd.addColorStop(0, '#fff');
    fGrd.addColorStop(.3, 'rgba(220,180,255,.9)');
    fGrd.addColorStop(1, 'rgba(88,28,180,0)');
    ctx.fillStyle = fGrd;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    flash *= .88;
  }

  // ── FADE A NEGRO FINAL ──
  if (T > 7.9) {
    const fp = clamp((T - 7.9) / .7, 0, 1);
    ctx.save();
    ctx.globalAlpha = fp;
    ctx.fillStyle   = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ── VIÑETA PERMANENTE ──
  const vGrd = ctx.createRadialGradient(cx, cy, H * .25, cx, cy, H * .95);
  vGrd.addColorStop(0, 'rgba(0,0,0,0)');
  vGrd.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = vGrd;
  ctx.fillRect(0, 0, W, H);

  // ── SKIP ──
  if (T > 2) {
    ctx.save();
    ctx.globalAlpha  = clamp((T - 2) * .4, 0, .22);
    ctx.font         = `400 10px -apple-system,sans-serif`;
    ctx.textAlign    = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle    = '#fff';
    ctx.letterSpacing = '3px';
    ctx.fillText('SALTAR', W - 24, H - 24);
    ctx.restore();
  }

  // Fin
  if (T > 8.6) { finish(); return; }

  raf = requestAnimationFrame(draw);
}

function finish() {
  if (done) return;
  done = true;
  cancelAnimationFrame(raf);
  canvas.style.transition = 'opacity .5s ease';
  canvas.style.opacity    = '0';
  setTimeout(() => canvas.style.display = 'none', 520);
}

canvas.addEventListener('click', () => {
  try { getAC(); } catch(e) {}
  if (t0 && (performance.now() - t0) / 1000 > 2) finish();
});
document.addEventListener('touchstart', () => { try { getAC(); } catch(e) {} }, { once: true });

// Arrancar
raf = requestAnimationFrame(draw);

})();
</script>

<script src="app.js"></script>
</body>
</html>
