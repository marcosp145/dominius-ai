<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dominius AI</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div class="background"><div class="particle-field"></div></div>

<div id="intro">
  <canvas id="bg3d"></canvas>

  <!-- Texto encima del canvas 3D -->
  <div id="intro-content">
    <div id="main-title">DOMINIUS AI</div>
    <div id="sub-title">Tu IA Empresarial</div>
    <div id="intro-line-h"></div>
  </div>

  <div id="skip-btn">SALTAR</div>
</div>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2 class="login-title">Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="input-group"><label>Usuario o Email</label><input type="text" id="loginUser" placeholder="Tu usuario o email" required></div>
      <div class="input-group"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="Tu contraseña" required></div>
      <div class="remember-me"><input type="checkbox" id="rememberMe"><label for="rememberMe">Recordar sesión</label></div>
      <button type="submit" class="login-button">Continuar</button>
    </form>
    <div class="form-footer">
      <span class="link" id="showForgotPassword">¿Olvidaste tu contraseña?</span>
      <span class="separator">·</span>
      <span class="link" id="showRegister">Crear cuenta</span>
    </div>
  </div>
</div>

<div class="login-screen" id="registerScreen">
  <div class="login-box">
    <h2 class="login-title">Crear Cuenta</h2>
    <form id="registerForm">
      <div class="input-group"><label>Nombre completo</label><input type="text" id="regName" placeholder="Tu nombre" required minlength="3"></div>
      <div class="input-group"><label>Usuario</label><input type="text" id="regUsername" placeholder="Nombre de usuario" required minlength="3"></div>
      <div class="input-group"><label>Email</label><input type="email" id="regEmail" placeholder="tu@email.com" required></div>
      <div class="input-group"><label>Contraseña</label><input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6"></div>
      <div class="input-group"><label>Confirmar Contraseña</label><input type="password" id="regConfirmPassword" placeholder="Repite tu contraseña" required></div>
      <button type="submit" class="login-button">Crear Cuenta</button>
    </form>
    <div class="form-footer"><span class="link" id="showLogin">¿Ya tienes cuenta? Inicia sesión</span></div>
  </div>
</div>

<div class="login-screen" id="forgotPasswordScreen">
  <div class="login-box">
    <h2 class="login-title">Recuperar Acceso</h2>
    <p class="forgot-info">Ingresa tu email y te enviaremos un código de recuperación</p>
    <form id="forgotPasswordForm">
      <div class="input-group"><label>Email</label><input type="email" id="forgotEmail" placeholder="tu@email.com" required></div>
      <button type="submit" class="login-button">Enviar Código</button>
    </form>
    <div class="form-footer"><span class="link" id="backToLogin">Volver</span></div>
  </div>
</div>

<div class="notification" id="notification"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><p>Un momento...</p></div>

<style>
/* ── INTRO CONTAINER ── */
#intro {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

#intro.fade-out {
  animation: introOut 1.2s cubic-bezier(0.76,0,0.24,1) forwards;
}
@keyframes introOut {
  0%   { opacity:1; }
  100% { opacity:0; pointer-events:none; }
}

/* Three.js canvas */
#bg3d {
  position: absolute;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
}

/* Contenido HTML encima */
#intro-content {
  position: relative;
  z-index: 2;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── TÍTULO PRINCIPAL ── */
#main-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: clamp(38px, 8vw, 92px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
  color: transparent;

  /* Gradiente */
  background: linear-gradient(
    135deg,
    #ffffff  0%,
    #ede9fe 25%,
    #a78bfa 50%,
    #ede9fe 75%,
    #ffffff 100%
  );
  background-size: 300% auto;
  background-clip: text;
  -webkit-background-clip: text;

  /* Empieza invisible */
  opacity: 0;
  transform: translateY(30px);
  filter: blur(12px);

  /* Animación */
  animation:
    titleIn 1.4s cubic-bezier(0.16,1,0.3,1) 1.2s forwards,
    shimmer 6s linear 2.8s infinite;

  text-shadow: none;
}

/* Glow del título — pseudoelemento */
#main-title::after {
  content: 'DOMINIUS AI';
  position: absolute;
  inset: 0;
  background: inherit;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  filter: blur(20px);
  opacity: .5;
  animation: glowPulse 3s ease-in-out 2.8s infinite;
}

#main-title { position: relative; }

@keyframes titleIn {
  0%   { opacity:0; transform:translateY(30px); filter:blur(12px); }
  100% { opacity:1; transform:translateY(0);    filter:blur(0); }
}

@keyframes shimmer {
  0%   { background-position: 0%   center; }
  100% { background-position: 300% center; }
}

@keyframes glowPulse {
  0%,100% { opacity:.4; }
  50%      { opacity:.7; }
}

/* Línea separadora */
#intro-line-h {
  width: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(167,139,250,.6), transparent);
  margin: clamp(18px,3vw,30px) auto clamp(14px,2.5vw,24px);
  animation: lineExpand 1s cubic-bezier(0.16,1,0.3,1) 2.3s forwards;
  box-shadow: 0 0 12px rgba(139,92,246,.4);
}

@keyframes lineExpand {
  0%   { width:0;   opacity:0; }
  100% { width:clamp(80px,20vw,200px); opacity:1; }
}

/* ── SUBTÍTULO ── */
#sub-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: clamp(11px, 1.4vw, 15px);
  font-weight: 300;
  letter-spacing: .5em;
  text-transform: uppercase;
  color: rgba(167,139,250,0);
  opacity: 0;
  transform: translateY(10px);
  animation: subIn .9s cubic-bezier(0.16,1,0.3,1) 2.7s forwards;
  order: 3;
}

@keyframes subIn {
  0%   { opacity:0; color:rgba(167,139,250,0);   transform:translateY(10px); }
  100% { opacity:1; color:rgba(167,139,250,.65); transform:translateY(0); }
}

/* ── SKIP ── */
#skip-btn {
  position: absolute;
  bottom: 28px; right: 28px;
  font-family: -apple-system, sans-serif;
  font-size: 10px;
  letter-spacing: 3px;
  color: rgba(255,255,255,.15);
  cursor: pointer;
  opacity: 0;
  animation: skipIn .6s ease 3s forwards;
  transition: color .3s;
  user-select: none;
}
#skip-btn:hover { color: rgba(255,255,255,.4); }
@keyframes skipIn { to { opacity:1; } }
</style>

<script>
(function () {

/* ══════════════════════════════════════
   THREE.JS — Campo de estrellas 3D
   con neblina volumétrica y movimiento
══════════════════════════════════════ */
const canvas   = document.getElementById('bg3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 5);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

/* ── FOG volumétrico ── */
scene.fog = new THREE.FogExp2(0x000000, 0.018);

/* ── ESTRELLAS — capa lejana ── */
function makeStars(count, spread, size, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count * 3; i++)
    pos[i] = (Math.random() - 0.5) * spread;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color,
    size,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0,
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return { pts, mat };
}

const stars1 = makeStars(3000, 800, 0.35, 0xffffff);
const stars2 = makeStars(800,  400, 0.6,  0xc4b5fd);
const stars3 = makeStars(300,  200, 0.9,  0x8b5cf6);

/* ── PLANO DE NEBLINA — horizonte ── */
const fogGeo = new THREE.PlaneGeometry(80, 4, 1, 1);
const fogMat = new THREE.MeshBasicMaterial({
  color: 0x5b21b6,
  transparent: true,
  opacity: 0,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const fogPlane = new THREE.Mesh(fogGeo, fogMat);
fogPlane.position.set(0, -1.8, -8);
fogPlane.rotation.x = -0.25;
scene.add(fogPlane);

/* ── SEGUNDO PLANO MÁS CERCANO Y BRILLANTE ── */
const fogGeo2 = new THREE.PlaneGeometry(60, 2);
const fogMat2 = new THREE.MeshBasicMaterial({
  color: 0x7c3aed,
  transparent: true,
  opacity: 0,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const fogPlane2 = new THREE.Mesh(fogGeo2, fogMat2);
fogPlane2.position.set(0, -1.6, -4);
fogPlane2.rotation.x = -0.2;
scene.add(fogPlane2);

/* ── ANILLO de luz — orbit ── */
const ringGeo = new THREE.TorusGeometry(3.5, 0.008, 2, 180);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x8b5cf6,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2.4;
ring.position.y = -0.3;
scene.add(ring);

const ringGeo2 = new THREE.TorusGeometry(5, 0.004, 2, 200);
const ringMat2 = new THREE.MeshBasicMaterial({
  color: 0x6d28d9,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
});
const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
ring2.rotation.x = Math.PI / 2.2;
ring2.position.y = -0.5;
scene.add(ring2);

/* ── LUZ CENTRAL — esfera de emisión ── */
const coreGeo = new THREE.SphereGeometry(0.4, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
});
const core = new THREE.Mesh(coreGeo, coreMat);
core.position.set(0, -0.3, -2);
scene.add(core);

/* ── HELPER easing ── */
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn  = t => t * t * t;
const clamp   = (v,a,b) => Math.min(b,Math.max(a,v));
const prog    = (t,a,b) => clamp((t-a)/(b-a),0,1);

/* ── AUDIO ── */
let AC, scoreStarted = false;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function buildScore() {
  try {
    const ac = getAC(), now = ac.currentTime;

    // Reverb
    const sr=ac.sampleRate, rl=sr*3, rb=ac.createBuffer(2,rl,sr);
    for(let c=0;c<2;c++){const d=rb.getChannelData(c);for(let i=0;i<rl;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2.5);}
    const rv=ac.createConvolver(); rv.buffer=rb;
    const rvg=ac.createGain(); rvg.gain.value=.45;
    rv.connect(rvg); rvg.connect(ac.destination);

    function O(f,w,d,t='sine',v=.15,det=0){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=t;o.frequency.value=f;o.detune.value=det;
      g.gain.setValueAtTime(0,now+w);
      g.gain.linearRampToValueAtTime(v,now+w+.05);
      g.gain.exponentialRampToValueAtTime(.0001,now+w+d);
      o.connect(g);g.connect(ac.destination);g.connect(rv);
      o.start(now+w);o.stop(now+w+d+.1);
    }
    function SW(f0,f1,w,d,v=.2){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(f0,now+w);
      o.frequency.exponentialRampToValueAtTime(f1,now+w+d);
      g.gain.setValueAtTime(0,now+w);
      g.gain.linearRampToValueAtTime(v,now+w+.05);
      g.gain.exponentialRampToValueAtTime(.0001,now+w+d);
      o.connect(g);g.connect(ac.destination);g.connect(rv);
      o.start(now+w);o.stop(now+w+d+.1);
    }
    function NS(w,d,v=.1,f=300){
      const sr2=ac.sampleRate,buf=ac.createBuffer(1,sr2*d,sr2),da=buf.getChannelData(0);
      for(let i=0;i<da.length;i++)da[i]=Math.random()*2-1;
      const src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
      fl.type='bandpass';fl.frequency.value=f;fl.Q.value=.7;
      src.buffer=buf;
      g.gain.setValueAtTime(0,now+w);
      g.gain.linearRampToValueAtTime(v,now+w+.04);
      g.gain.exponentialRampToValueAtTime(.0001,now+w+d);
      src.connect(fl);fl.connect(g);g.connect(ac.destination);g.connect(rv);
      src.start(now+w);src.stop(now+w+d+.1);
    }

    // Deep void rumble
    O(28,.2,9,'sine',.35);
    O(28,.2,9,'triangle',.08,-7);
    SW(25,60,.2,4,.3);
    NS(.2,2.5,.08,80);

    // Horizonte aparece ~t=1
    SW(80,160,1,2.5,.12);
    NS(1,1.5,.06,200);

    // Anillos ~t=2
    O(110,2,5,'sine',.14);
    O(110,2,5,'triangle',.04,6);

    // Core brilla ~t=2.5
    NS(2.5,.8,.2,400);
    SW(400,800,2.5,.6,.04);

    // Título aparece ~t=1.2
    O(55,1.2,6,'sine',.3);
    O(82,1.4,5,'sine',.15);

    // Acorde que se despliega ~t=2.8
    [[165,.12],[220,.09],[277,.07],[330,.05],[440,.035],[550,.022]]
      .forEach(([f,v],i)=>{
        O(f,2.8+i*.08,5,'sine',v);
        O(f,2.8+i*.08,5,'triangle',v*.15,5);
      });

    // Shimmer alto
    O(880,3.2,4,'sine',.018);
    O(1320,3.6,3,'sine',.010);
    SW(500,1200,3.0,3,.015);

  } catch(e) {}
}

/* ── RENDER LOOP ── */
let introFinished = false;
const clock = new THREE.Clock();

function animate() {
  if (introFinished) return;
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();

  // Lanzar audio
  if (!scoreStarted && elapsed > .1) {
    scoreStarted = true;
    buildScore();
  }

  // Estrellas aparecen
  const stP = easeOut(prog(elapsed, .2, 2.5));
  stars1.mat.opacity = stP * .9;
  stars2.mat.opacity = stP * .7;
  stars3.mat.opacity = stP * .8;

  // Rotar estrellas muy lento — parallax
  stars1.pts.rotation.y = elapsed * .008;
  stars2.pts.rotation.y = elapsed * .012;
  stars3.pts.rotation.y = elapsed * .018;
  stars1.pts.rotation.x = Math.sin(elapsed * .003) * .02;

  // Cámara se acerca muy suavemente
  camera.position.z = 5 - easeOut(prog(elapsed, 0, 8)) * 1.2;
  camera.position.y = Math.sin(elapsed * .15) * .04;
  camera.rotation.z = Math.sin(elapsed * .1) * .005;

  // Fog / horizonte
  const fogP = easeOut(prog(elapsed, .8, 2.8));
  fogMat.opacity  = fogP * .18;
  fogMat2.opacity = fogP * .1;
  fogPlane.position.y  = -1.8 + fogP * .3;
  fogPlane2.position.y = -1.6 + fogP * .25;

  // Anillos
  const ringP = easeOut(prog(elapsed, 1.8, 3.5));
  ringMat.opacity  = ringP * .35;
  ringMat2.opacity = ringP * .2;
  ring.rotation.z  = elapsed * .12;
  ring2.rotation.z = -elapsed * .08;

  // Core
  const coreP = easeOut(prog(elapsed, 2.2, 3.5));
  coreMat.opacity = coreP * (.5 + Math.sin(elapsed * 2) * .15);
  core.scale.setScalar(1 + Math.sin(elapsed * 2.5) * .08);

  renderer.render(scene, camera);
}
animate();

/* ── SALIDA ── */
let done = false;
function finish() {
  if (done) return;
  done = true;
  const intro = document.getElementById('intro');
  intro.classList.add('fade-out');
  setTimeout(() => {
    introFinished = true;
    intro.style.display = 'none';
  }, 1250);
}

// Auto salida a los 8s
setTimeout(finish, 8000);

document.getElementById('skip-btn').addEventListener('click', finish);
document.getElementById('intro').addEventListener('click', () => {
  if (clock.getElapsedTime() > 2.5) finish();
});
document.addEventListener('touchstart', () => { try { getAC(); } catch(e) {} }, { once: true });

})();
</script>

<script src="app.js"></script>
</body>
</html>
